[project]
name = "opencompete"
version = "0.1.0"
description = "Local, evidence-grounded competitive research built on Open Deep Research."
authors = [
    { name = "Lance Martin" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-tavily",
    "langchain-groq>=0.2.4",
    "openai>=1.99.2",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.25.3",
    "xmltodict>=0.14.2",
    "linkup-sdk>=0.2.3",
    "duckduckgo-search>=3.0.0",
    "exa-py>=1.8.8",
    "requests>=2.32.3",
    "beautifulsoup4==4.14.3",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.14.0,<3.0.0",
    "pytest",
    "httpx>=0.24.0",
    "markdownify>=0.11.6",
    "azure-identity>=1.21.0",
    "azure-search>=1.0.0b2",
    "azure-search-documents>=11.5.2",
    "rich>=13.0.0",
    "langgraph-cli[inmem]>=0.3.1",
    "langsmith>=0.3.37",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "ipykernel>=6.29.5",
    "supabase>=2.15.3",
    "mcp>=1.9.4",
    "langchain-aws>=0.2.28",
    "pandas>=2.3.1",
    "fastapi>=0.141.1",
    "sse-starlette>=2.1.3",
    "uvicorn>=0.34.3",
    "tomlkit>=0.15.1",
]

[project.scripts]
opencompete = "opencompete.cli:main"
opencompete-race = "opencompete.drb_cli:main"
opencompete-api = "opencompete.api.server:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_deep_research*", "opencompete*", "legacy*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
extend-exclude = [
    "src/legacy",
    "src/security",
    "tests/evaluators.py",
    "tests/extract_langsmith_data.py",
    "tests/pairwise_evaluation.py",
    "tests/prompts.py",
    "tests/run_evaluate.py",
    "tests/supervisor_parallel_evaluation.py",
]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/open_deep_research/utils.py" = ["UP017", "UP041"]

[tool.ruff.lint.pydocstyle]
convention = "google"
